# Render blueprint: one service serves every city (selected by domain).
# Point austin.makeitstretch.org at this service; add more city domains the same way.
services:
  - type: web
    name: makeitstretch-civic
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEFAULT_CITY
        value: austin
      - key: BLS_KEY
        sync: false
      # Food directory + admin (Supabase project makeitstretch-civic, one database for all cities)
      - key: SUPABASE_URL
        value: https://lfdbqqnjmqcmtjcvmrcl.supabase.co
      - key: SUPABASE_SECRET_KEY   # Supabase → Project Settings → API Keys → secret key. Server only.
        sync: false
      - key: ADMIN_KEY             # your password for /admin
        sync: false
